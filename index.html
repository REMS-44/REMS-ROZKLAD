<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Факультет · Розклад</title>
  <meta name="theme-color" content="#1b0d2f">
  <link rel="stylesheet" href="styles.css?v=2.0.11">
</head>
<body class="rems-studio">
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span>Ф</span></div>
      <div class="brand-copy"><b>ФТКЕ</b><span>СИСТЕМА РОЗКЛАДУ</span></div>
    </div>
    <div class="sidebar-studio-label"><span id="sidebarScopeKind">КАФЕДРА</span><b id="sidebarDepartmentLabel">режисура естради і шоу</b></div>
    <div class="program-scope-box">
      <label for="programScope">ПРОГРАМА</label>
      <select id="programScope" aria-label="Програма"></select>
      <span id="programScopeFaculty">Факультет театру, кіно та естради</span>
    </div>
    <nav>
      <button class="nav-btn teacher-only-nav" id="teacherScheduleNav" data-page="mySchedule" style="display:none"><i class="nav-icon">▦</i><span>Мій розклад</span></button>
      <button class="nav-btn active" data-page="home"><i class="nav-icon">⌂</i><span>Головна</span></button>
      <button class="nav-btn" data-page="faculty"><i class="nav-icon">◎</i><span>Структура факультету</span></button>

      <div class="nav-section-label">ПЛАНУВАННЯ</div>
      <button class="nav-btn" data-page="curricula"><i class="nav-icon">▤</i><span>Навчальні плани</span></button>
      <button class="nav-btn" data-page="disciplines"><i class="nav-icon">◇</i><span>Навантаження</span></button>

      <div class="nav-section-label">РОЗКЛАД</div>
      <button class="nav-btn" data-page="schedule"><i class="nav-icon">✎</i><span>Складання розкладу</span></button>
      <button class="nav-btn" data-page="timetable"><i class="nav-icon">▦</i><span>Розклад</span></button>
      <button class="nav-btn" data-page="dayPlanner"><i class="nav-icon">▦</i><span>По днях груп</span></button>
      <button class="nav-btn" data-page="specialSchedule"><i class="nav-icon">◫</i><span>Індивідуальні / бакалаврські</span></button>
      <button class="nav-btn" data-page="roomGrid"><i class="nav-icon">▥</i><span>Аудиторії</span></button>

      <div class="nav-section-label">ЛЮДИ</div>
      <button class="nav-btn" data-page="groups"><i class="nav-icon">◉</i><span>Групи і студенти</span></button>
      <button class="nav-btn" data-page="teachers"><i class="nav-icon">♟</i><span>Викладачі</span></button>

      <div class="nav-bottom">
        <button class="nav-btn" data-page="settings"><i class="nav-icon">⚙</i><span>Налаштування</span></button>
      </div>
    </nav>
    <div id="cloudSidebar" class="cloud-sidebar">
      <div id="cloudStatusDot" class="cloud-dot local"></div>
      <div><b id="cloudStatusText">Локальний режим</b><span id="cloudUserText">Firebase не підключено</span></div>
    </div>
    <div class="sidebar-note">Версія 2.0.13 · конкретні дати + семінари</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-copy">
        <span class="topbar-kicker" id="topbarKicker">РОБОЧИЙ ПУЛЬТ</span>
        <h1 id="pageTitle">Головна</h1>
        <p id="pageSubtitle">Кафедральний пульт розкладу</p>
      </div>
      <div class="topbar-signature" aria-hidden="true"><i></i><i></i><i></i></div>
    </header>
    <section id="page-home" class="page active"></section>
    <section id="page-faculty" class="page"></section>
    <section id="page-schedule" class="page"></section>
    <section id="page-specialSchedule" class="page"></section>
    <section id="page-timetable" class="page"></section>
    <section id="page-dayPlanner" class="page"></section>
    <section id="page-mySchedule" class="page"></section>
    <section id="page-groups" class="page"></section>
    <section id="page-students" class="page"></section>
    <section id="page-rooms" class="page"></section>
    <section id="page-roomGrid" class="page"></section>
    <section id="page-teachers" class="page"></section>
    <section id="page-curricula" class="page"></section>
    <section id="page-disciplines" class="page"></section>
    <section id="page-lessonTypes" class="page"></section>
    <section id="page-users" class="page"></section>
    <section id="page-bellSchedule" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" id="modalClose">×</button><div id="modalBody"></div></div></div>
<input id="importFile" type="file" accept=".json" hidden>
<script src="data.js?v=2.0.11"></script>
<script src="firebase-config.js"></script>
<script src="word-export.js?v=2.0.11"></script>
<script src="app.js?v=2.0.13"></script>
<script type="module" src="cloud.js?v=2.0.13"></script>
</body>
</html>
