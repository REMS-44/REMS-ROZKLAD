<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>РЕМС-Розклад</title>
  <meta name="theme-color" content="#6d28d9">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">Р</div><div><b>РЕМС</b><span>РОЗКЛАД</span></div></div>
    <nav>
      <button class="nav-btn teacher-only-nav" id="teacherScheduleNav" data-page="mySchedule" style="display:none">▦ <span>Мій розклад</span></button>
      <button class="nav-btn active" data-page="home">⌂ <span>Головна</span></button>

      <div class="nav-section-label">ПЛАНУВАННЯ</div>
      <button class="nav-btn" data-page="curricula">▤ <span>Навчальні плани</span></button>
      <button class="nav-btn" data-page="disciplines">◇ <span>Навантаження</span></button>

      <div class="nav-section-label">РОЗКЛАД</div>
      <button class="nav-btn" data-page="schedule">✎ <span>Складання розкладу</span></button>
      <button class="nav-btn" data-page="timetable">▦ <span>Розклад</span></button>
      <button class="nav-btn" data-page="roomGrid">▥ <span>Аудиторії</span></button>

      <div class="nav-section-label">ЛЮДИ</div>
      <button class="nav-btn" data-page="groups">◉ <span>Групи і студенти</span></button>
      <button class="nav-btn" data-page="teachers">♟ <span>Викладачі</span></button>

      <div class="nav-bottom">
        <button class="nav-btn" data-page="settings">⚙ <span>Налаштування</span></button>
      </div>
    </nav>
    <div id="cloudSidebar" class="cloud-sidebar">
      <div id="cloudStatusDot" class="cloud-dot local"></div>
      <div><b id="cloudStatusText">Локальний режим</b><span id="cloudUserText">Firebase не підключено</span></div>
    </div>
    <div class="sidebar-note">Версія 1.0.18 · серійна постановка</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">Головна</h1><p id="pageSubtitle">Кафедральний пульт розкладу</p></div>
    </header>
    <section id="page-home" class="page active"></section>
    <section id="page-schedule" class="page"></section>
    <section id="page-timetable" class="page"></section>
    <section id="page-mySchedule" class="page"></section>
    <section id="page-groups" class="page"></section>
    <section id="page-students" class="page"></section>
    <section id="page-rooms" class="page"></section>
    <section id="page-roomGrid" class="page"></section>
    <section id="page-teachers" class="page"></section>
    <section id="page-curricula" class="page"></section>
    <section id="page-disciplines" class="page"></section>
    <section id="page-lessonTypes" class="page"></section>
    <section id="page-users" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" id="modalClose">×</button><div id="modalBody"></div></div></div>
<input id="importFile" type="file" accept=".json" hidden>
<script src="data.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script type="module" src="cloud.js"></script>
</body>
</html>
